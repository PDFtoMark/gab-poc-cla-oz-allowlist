---
name: CLA Assistant PoC
on:
  issue_comment:
    types:
      - created
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: Read Allowlist File
        id: read_allowlist
        run: |
          printf 'dependabot[bot]\nrenovate[bot]\n' > allowlist.txt
          ALLOWLIST=$(cat allowlist.txt)
          echo "allowlist=$ALLOWLIST" >> $GITHUB_OUTPUT
      - name: Check if user is in allowlist (verbatim logic from target)
        id: check_allowlist
        run: |
          PR_USER=${{ github.event.pull_request.user.login }}
          echo "PR_USER=[$PR_USER]"
          echo "ALLOWLIST_OUT=[${{ steps.read_allowlist.outputs.allowlist }}]"
          if [[ "${{ steps.read_allowlist.outputs.allowlist }}" == *"$PR_USER"* ]]; then
            echo "is_allowed=true" >> $GITHUB_OUTPUT
          else
            echo "is_allowed=false" >> $GITHUB_OUTPUT
          fi
          echo "--- control: same test with a real, non-allowlisted username"
          if [[ "${{ steps.read_allowlist.outputs.allowlist }}" == *"some-outsider"* ]]; then
            echo "control_is_allowed=true"
          else
            echo "control_is_allowed=false"
          fi
      - name: Label PR as CLA Allowlist (verbatim from target)
        if: ${{ steps.check_allowlist.outputs.is_allowed == 'true' }}
        run: |-
          PR_NUMBER="${{ github.event.issue.number }}"
          ENDPOINT="https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/labels"
          curl -sS -L -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$ENDPOINT/cla:%20unsigned" || true
          curl -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"labels":["cla: allowlist"]}' \
            $ENDPOINT
